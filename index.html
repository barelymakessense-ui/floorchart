<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floorchart: Orna Monument Rewards</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      margin: 0;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 { margin: 0; color: #ffffff; font-size: 2.2em; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    h2 { margin: 5px 0 0; color: #58a6ff; font-weight: 400; font-size: 1.2em; }

    /* Layout grid for the 4 Monuments */
    .monument-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Individual Monument Panels */
    .monument-box {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      overflow-x: auto; /* Fallback for very narrow devices */
    }
    .monument-title {
      font-size: 1.6em;
      font-weight: bold;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }

    /* Elemental Border Colors */
    .ithra-box   { border-color: #1f6feb; }
    .ithra-title { color: #58a6ff; }
    .thor-box    { border-color: #d29922; }
    .thor-title  { color: #f2cc60; }
    .vulcan-box  { border-color: #f85149; }
    .vulcan-title{ color: #ff7b72; }
    .demeter-box { border-color: #238636; }
    .demeter-title{ color: #56d364; }

   /* 6-Column Spreadsheet Layout with a narrow first column */
    .rewards-list {
      display: grid;
      /* First column is 60px */
      grid-template-columns: 60px repeat(5, minmax(100px, 1fr));
      gap: 8px;
    }

    /* Standard Grid Cells */
    .reward-item {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 12px 8px;
      font-size: 0.85em;
      color: #e6edf3;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      word-wrap: break-word;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Highlighting Style for First Row & First Column Labels */
    .reward-item.axis-label {
      background: transparent !important;
      border: none !important;
      color: #8b949e !important;
      font-weight: 600;
    }

    /* Blank cell layout control */
    .reward-item.empty-cell {
      background: transparent !important;
      border: 1px dashed rgba(48, 54, 61, 0.3);
      color: transparent !important;
    }

    /* DYNAMIC HIGHLIGHTING PROFILES */
    .hl-accessory      { background-color: #1f425c; color: #76c7ff; border-color: #31648a; }
    .hl-arenatoken     { background-color: #4a2323; color: #ff8585; border-color: #733b3b; }
    .hl-material       { background-color: #3b2d23; color: #d4a373; border-color: #E5DAD2; }
    .hl-monsterremains { background-color: #402407; color: #d4a373; border-color: #4D2D09; }
    .hl-orns           { background-color: #0d2a5c; color: #58a6ff; border-color: #1f57b3; }
    .hl-proofs         { background-color: #423b1c; color: #f2cc60; border-color: #695e31; }
    .hl-potions        { background-color: #4a2a3a; color: #ff9ebb; border-color: #73435b; }
    .hl-skeletonkey    { background-color: #3d444d; color: #dbedff; border-color: #57606a; }
    .hl-weapon         { background-color: #133a1b; color: #56d364; border-color: #235e2f; }
    .hl-astralseed     { background-color: #1b4728; color: #7ee787; border-color: #2b6b3b; }
    .hl-summoningitem  { background-color: #321f47; color: #d3b3ee; border-color: #533575; }
    .hl-ornateitem     { background-color: #6e1c18; color: #ffa199; border-color: #a62c26; font-weight: bold; }
    .hl-rare-material  { background-color: #4c1d70; color: #e1b3ff; border-color: #8a3cd9; font-weight: 600; }

    /* MOBILE SCALE OPTIMIZATIONS (For screens smaller than 640px) */
    @media (max-width: 640px) {
      body {
        padding: 10px;
      }
      header {
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.8em;
      }
      h2 {
        font-size: 1em;
      }
      .monument-box {
        padding: 10px;
        border-radius: 8px;
      }
      /* Reduce grid minimum size so the 6 columns can squish closer together safely */
      .rewards-list {
        grid-template-columns: 45px repeat(5, minmax(50px, 1fr));
        gap: 4px;
      }
      /* Shrink padding and font size slightly so text fits inside the smaller grid elements */
      .reward-item {
        padding: 6px 2px;
        font-size: 0.72em;
        min-height: 34px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Floorchart</h1>
    <h2 id="week-display">Monument Rewards</h2>
    <center style="margin-top: 5px; font-size: 0.9em; color: #8b949e;">An Orna Monument Rewards Tracker By Truffles v1.2</center>
  </header>

  <div class="monument-grid">
    <div class="monument-box ithra-box">
      <div class="monument-title ithra-title">Ithra</div>
      <div class="rewards-list" id="ithra-rewards">Loading layout...</div>
    </div>

    <div class="monument-box thor-box">
      <div class="monument-title thor-title">Thor</div>
      <div class="rewards-list" id="thor-rewards">Loading layout...</div>
    </div>

    <div class="monument-box vulcan-box">
      <div class="monument-title vulcan-title">Vulcan</div>
      <div class="rewards-list" id="vulcan-rewards">Loading layout...</div>
    </div>

    <div class="monument-box demeter-box">
      <div class="monument-title demeter-title">Demeter</div>
      <div class="rewards-list" id="demeter-rewards">Loading layout...</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdFKngD-4VYHLkShs-9n04WZmpENwgkI0Hjheve-FmkUh0aCVlTG3h6Iy_LOjdMyXjLw/exec";

    const colorRules = {
      "accessory": "hl-accessory",
      "arena tokens": "hl-arenatoken",
      "arena token": "hl-arenatoken",
      "materials": "hl-material",
      "material": "hl-material",
      "monster remains": "hl-monsterremains",
      "orns": "hl-orns",
      "proofs": "hl-proofs",
      "proof": "hl-proofs",
      "potions": "hl-potions",
      "potion": "hl-potions",
      "skeleton keys": "hl-skeletonkey",
      "skeleton key": "hl-skeletonkey",
      "weapon": "hl-weapon",
      "astralseed": "hl-astralseed",
      "summoning item": "hl-summoningitem",
      "rare consumable": "hl-summoningitem",
      "ornate item": "hl-ornateitem",
      "avalon ore": "hl-rare-material",
      "c ortanite": "hl-rare-material",
      "hardened steel": "hl-rare-material",
      "p runestone": "hl-rare-material",
      "p draconite": "hl-rare-material",
      "realm ore": "hl-rare-material",
      "titanium": "hl-rare-material",
    };

    window.onload = function() {
      fetchData();
    };

    function fetchData() {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", executeFetch);
      } else {
        executeFetch();
      }
    }

    function executeFetch() {
      fetch(WEB_APP_URL)
        .then(response => {
          if (!response.ok) throw new Error("Network response error: " + response.statusText);
          return response.json();
        })
        .then(data => populateDashboard(data))
        .catch(err => showBackendError(err));
    }

    function populateDashboard(data) {
      if (!data || data.error) {
        showError(data ? data.error : "No data structure received.");
        return;
      }

      document.getElementById('week-display').innerText = "Week " + (data.week || "??") + " Monument Rewards";

      if (data.ithra) renderBox("ithra-rewards", data.ithra);
      if (data.thor) renderBox("thor-rewards", data.thor);
      if (data.vulcan) renderBox("vulcan-rewards", data.vulcan);
      if (data.demeter) renderBox("demeter-rewards", data.demeter);
    }

    function renderBox(elementId, rows) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = ""; 
      
      if (rows.length > 0 && rows[0].length > 0) {
        rows[0][0] = "Floor";
      }

      rows.forEach((row, rowIndex) => {
        row.forEach((cellValue, colIndex) => {
          const cleanVal = cellValue ? cellValue.toString().trim() : "";
          const itemDiv = document.createElement('div');
          
          if (cleanVal === "") {
            itemDiv.classList.add('reward-item', 'empty-cell');
          } else {
            itemDiv.classList.add('reward-item');
            itemDiv.innerText = cleanVal; 

            if (rowIndex === 0 || colIndex === 0) {
              itemDiv.classList.add('axis-label');
            } else {
              const matchKey = cleanVal.toLowerCase();
              if (colorRules[matchKey]) {
                itemDiv.classList.add(colorRules[matchKey]);
              }
            }
          }
          
          container.appendChild(itemDiv);
        });
      });
    }

    function showBackendError(err) {
      showError("API Connection Failure: " + err.message);
    }

    function showError(message) {
      const grid = document.querySelector('.monument-grid');
      if (grid) {
        grid.style.gridTemplateColumns = "1fr";
        grid.innerHTML = `
          <div class="monument-box" style="border-color: #f85149; text-align: center; font-size: 1.2em; color: #ff7b72;">
            <strong>System Connection Error:</strong><br>${message}
          </div>`;
      }
    }
  </script>

</body>
</html>
